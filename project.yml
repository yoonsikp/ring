name: Ring
options:
  bundleIdPrefix: com.yoonsikp
  deploymentTarget:
    macOS: "13.0"
packages:
  linphonesw:
    url: https://gitlab.linphone.org/BC/public/linphone-sdk-swift-macos.git
    exactVersion: 5.5.41
  PhoneNumberKit:
    url: https://github.com/marmelroy/PhoneNumberKit.git
    exactVersion: 4.3.0
targets:
  Ring:
    type: application
    platform: macOS
    sources: [Ring]
    dependencies:
      - package: linphonesw
      - package: PhoneNumberKit
        product: PhoneNumberKit
    info:
      path: Ring/Info.plist
      properties:
        CFBundleDisplayName: Ring
        LSUIElement: true
        NSMicrophoneUsageDescription: Ring needs the microphone for voice calls.
    entitlements:
      path: Ring/Ring.entitlements
      properties:
        com.apple.security.device.audio-input: true
        # Let the hardened runtime load the linphone SDK frameworks, which are signed with a
        # different Team ID than Ring (ad-hoc builds have none).
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoonsikp.Ring
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO # the post-build step edits the built app
        # Universal (Intel + Apple Silicon) by default; `make native` builds this Mac's only.
        ARCHS: $(ARCHS_STANDARD)
        ONLY_ACTIVE_ARCH: NO
        SWIFT_OPTIMIZATION_LEVEL: -Osize
        GCC_OPTIMIZATION_LEVEL: s
        DEAD_CODE_STRIPPING: YES
        STRIP_INSTALLED_PRODUCT: YES
        DEPLOYMENT_POSTPROCESSING: YES
        STRIP_STYLE: all
    postBuildScripts:
      - name: Remove unused liblinphone media
        basedOnDependencyAnalysis: false
        script: |
          # The SDK ships ~9 MB of sounds. Ring has its own ring tone (Ring/Sounds/ringtone.mkv),
          # so keep only the ringback tone (ringback.wav) and silence.mkv. The SDK ring tones,
          # hold music, test recordings and the chat sound go.
          set -e
          FW="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Frameworks/linphone.framework"
          RES="$FW/Versions/A/Resources"
          [ -d "$RES" ] || { echo "warning: $RES not found, skipping"; exit 0; }
          for f in notes_of_the_optimistic.mkv oldphone-mono.wav \
                   dont_wait_too_long.mkv its_a_game.mkv soft_as_snow.mkv house_keeping.mkv \
                   four_hands_together.mkv leaving_dreams.mkv toy-mono.wav hello16000.wav \
                   hello8000.wav incoming_chat.wav; do
            rm -f "$RES/$f"
          done

      - name: Thin and strip embedded frameworks
        basedOnDependencyAnalysis: false
        script: |
          # The SDK frameworks are universal (Intel + Apple Silicon). Keep only the architecture(s)
          # Ring is being built for, and strip local symbols. Roughly halves the app.
          set -e
          FRAMEWORKS="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Frameworks"
          [ -d "$FRAMEWORKS" ] || exit 0
          # Every Mach-O file in the frameworks: the main binaries and nested plugins such as
          # mediastreamer2.framework/Versions/A/Libraries/libmswebrtc.so.
          find "$FRAMEWORKS" -type f ! -path '*/_CodeSignature/*' | while read -r bin; do
            file -b "$bin" | grep -q 'Mach-O' || continue
            have=$(lipo -archs "$bin")
            set -- $ARCHS
            if [ $# -eq 1 ] && [ "$have" != "$1" ] && echo " $have " | grep -q " $1 "; then
              lipo -thin "$1" "$bin" -output "$bin.thin" && mv "$bin.thin" "$bin"
            fi
            strip -x "$bin" 2>/dev/null || true
          done

      - name: Re-sign embedded frameworks with Ring's identity
        basedOnDependencyAnalysis: false
        script: |
          # The linphone SDK frameworks come signed with Belledonne's Team ID. With the hardened
          # runtime, macOS only loads libraries from the same Team ID as the app ("mapping process
          # and mapped file have different Team IDs"), so sign them all with Ring's own identity
          # (ad-hoc "-" by default). This also re-seals linphone.framework after the media cleanup.
          set -e
          FRAMEWORKS="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Frameworks"
          [ -d "$FRAMEWORKS" ] || exit 0
          # Real identities (Developer ID for release) get a secure timestamp and the hardened
          # runtime, which notarization requires; ad-hoc ("-") builds can't be timestamped.
          ID="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "$ID" = "-" ]; then TS="--timestamp=none"; else TS="--timestamp"; fi
          sign() { codesign --force --sign "$ID" --options runtime $TS --preserve-metadata=identifier "$1"; }
          for fw in "$FRAMEWORKS"/*.framework "$FRAMEWORKS"/*.dylib; do
            [ -e "$fw" ] || continue
            if [ -d "$fw" ]; then
              # Inside-out: nested Mach-O files (plugins like Libraries/libmswebrtc.so) first,
              # then the framework itself. Notarization rejects any unsigned nested binary.
              name=$(basename "$fw" .framework)
              find "$fw" -type f ! -path '*/_CodeSignature/*' | while read -r f; do
                [ "$(basename "$f")" = "$name" ] && continue
                if file -b "$f" | grep -q 'Mach-O'; then sign "$f"; fi
              done
            fi
            sign "$fw"
          done

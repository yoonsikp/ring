name: Ring
options:
  bundleIdPrefix: com.yoonsikp
  deploymentTarget:
    macOS: "13.0"
packages:
  linphonesw:
    url: https://gitlab.linphone.org/BC/public/linphone-sdk-swift-macos.git
    exactVersion: 5.5.41
  PhoneNumberKit:
    url: https://github.com/marmelroy/PhoneNumberKit.git
    exactVersion: 4.3.0
targets:
  Ring:
    type: application
    platform: macOS
    sources: [Ring]
    dependencies:
      - package: linphonesw
      - package: PhoneNumberKit
        product: PhoneNumberKit
    info:
      path: Ring/Info.plist
      properties:
        CFBundleDisplayName: Ring
        LSUIElement: true
        NSMicrophoneUsageDescription: Ring needs the microphone for voice calls.
    entitlements:
      path: Ring/Ring.entitlements
      properties:
        com.apple.security.device.audio-input: true
        # Let the hardened runtime load the linphone SDK frameworks, which are signed with a
        # different Team ID than Ring (ad-hoc builds have none).
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoonsikp.Ring
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO # the post-build step edits the built app
    postBuildScripts:
      - name: Remove unused liblinphone media
        basedOnDependencyAnalysis: false
        script: |
          # The SDK ships ~9 MB of sounds. Ring has its own ring tone (Ring/Sounds/ringtone.wav),
          # so keep only the ringback tone (ringback.wav) and silence.mkv. The SDK ring tones,
          # hold music, test recordings and the chat sound go.
          set -e
          FW="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Frameworks/linphone.framework"
          RES="$FW/Versions/A/Resources"
          [ -d "$RES" ] || { echo "warning: $RES not found, skipping"; exit 0; }
          for f in notes_of_the_optimistic.mkv oldphone-mono.wav \
                   dont_wait_too_long.mkv its_a_game.mkv soft_as_snow.mkv house_keeping.mkv \
                   four_hands_together.mkv leaving_dreams.mkv toy-mono.wav hello16000.wav \
                   hello8000.wav incoming_chat.wav; do
            rm -f "$RES/$f"
          done

      - name: Re-sign embedded frameworks with Ring's identity
        basedOnDependencyAnalysis: false
        script: |
          # The linphone SDK frameworks come signed with Belledonne's Team ID. With the hardened
          # runtime, macOS only loads libraries from the same Team ID as the app ("mapping process
          # and mapped file have different Team IDs"), so sign them all with Ring's own identity
          # (ad-hoc "-" by default). This also re-seals linphone.framework after the media cleanup.
          set -e
          FRAMEWORKS="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Frameworks"
          [ -d "$FRAMEWORKS" ] || exit 0
          for fw in "$FRAMEWORKS"/*.framework "$FRAMEWORKS"/*.dylib; do
            [ -e "$fw" ] || continue
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" \
              --preserve-metadata=identifier,flags --timestamp=none "$fw"
          done
